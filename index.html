<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <style>
    :root { --navy: #001f3f; --accent: #0074D9; --white: #ffffff; --gold: #FFD700; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--navy); margin: 0; padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: var(--white); width: 100%; max-width: 380px; border-radius: 15px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; height: fit-content; transition: 0.3s; }
    .logo { width: 100px; margin-bottom: 10px; }
    h2 { color: var(--navy); margin-bottom: 15px; font-size: 20px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    label { display: block; text-align: left; font-size: 12px; color: var(--navy); font-weight: bold; margin-bottom: 5px; }
    .btn-main { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-link { width: 100%; padding: 10px; background: white; color: var(--navy); border: 1px solid var(--navy); border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    #status { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; white-space: pre-wrap; }
    .success { background: #d4edda; color: #155724; }
    .warning { background: #fff3cd; color: #856404; }
    .error { background: #f8d7da; color: #721c24; }
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 300px; text-align: left; }
    .staff-link { margin-top: 20px; font-size: 11px; color: #bbb; cursor: pointer; text-decoration: underline; display: block; }
    .hidden { display: none !important; }
  </style>
</head>

  <div id="loader"><p>🛰️ Location Check...</p></div>

    <input type="text" id="sid" placeholder="ID NUMBER" maxlength="10" oninput="this.value = this.value.toUpperCase()">
    
    <div id="regFields" style="display:none; border-top: 1px solid #eee; padding-top: 10px;">
      <input type="text" id="sname" placeholder="Full Name Surname" oninput="this.value = this.value.toUpperCase()">

      <input type="tel" id="sdob" placeholder="DD/MM/YYYY" maxlength="10" oninput="formatDate(this)">

        <option value="" disabled selected>Blood Group</option>
        <option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option>

    <button id="btn" class="btn-main" onclick="handleSubmit()">SUBMIT ACCESS</button>

<div id="noticeModal" class="modal">
  <div class="modal-content">
    <h3 id="nTitle" style="color:var(--navy); margin-top:0;"></h3>
    <p id="nBody" style="font-size:14px; color:#444;"></p>
    <button class="btn-main" onclick="closeNotice()" style="padding:10px;">OK</button>
  </div>
</div>

<script>
  const CONFIG = { LAT: 22.443328, LON: 88.415341, RADIUS: 300, COOLDOWN: 90000, PIN: "1234" };

  function formatDate(input) {
    let v = input.value.replace(/\D/g, '').slice(0, 8);
    if (v.length >= 5) { input.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4); }
    else if (v.length >= 3) { input.value = v.slice(0, 2) + '/' + v.slice(2); }
    else { input.value = v; }
  }

  window.onload = function() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const d = calcDist(pos.coords.latitude, pos.coords.longitude, CONFIG.LAT, CONFIG.LON);
        if (d <= CONFIG.RADIUS) { showApp(); } 
        else { document.getElementById('loader').innerHTML = "🚫 OUTSIDE RANGE"; }
      }, () => { document.getElementById('loader').innerHTML = "⚠️ ENABLE GPS"; });
    }
  };

  function calcDist(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
    const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function showApp() {
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadNotice();
  }

  function staffBypass() {
    if (prompt("Staff PIN:") === CONFIG.PIN) { localStorage.clear(); showApp(); }
  }

  function handleSubmit() {
    const id = document.getElementById('sid').value.trim();
    if (!id) return;
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.innerText = "WAIT...";

    google.script.run.withSuccessHandler(res => {
      btn.disabled = false; btn.innerText = "SUBMIT ACCESS";
      if (res === "NEW_USER") {
        document.getElementById('regFields').style.display = 'block';
        showStatus("Please Register First", "warning");
      } else {
        // DISPLAY BIRTHDAY MESSAGE IF IT EXISTS
        let msg = res.bday ? res.bday + "\n" + res.status + ": " + res.name : res.status + ": " + res.name;
        showStatus(msg, "success");
        if(res.bday) document.getElementById('mainContainer').style.boxShadow = "0 0 25px var(--gold)";
        setTimeout(() => location.reload(), 4500);
      }
    }).processScan({
      studentId: id, name: document.getElementById('sname').value,
      dob: document.getElementById('sdob').value, blood: document.getElementById('sblood').value,
      mobile: document.getElementById('smobile').value, dept: document.getElementById('sdept').value, 
      role: document.getElementById('srole').value
    });
  }

  function loadNotice() {
    google.script.run.withSuccessHandler(n => {
      if (n) {
        document.getElementById('nTitle').innerText = n.title;
        document.getElementById('nBody').innerText = n.content;
        document.getElementById('noticeModal').style.display = 'flex';
      }
    }).getLatestNotice();
  }

  function closeNotice() { document.getElementById('noticeModal').style.display = 'none'; }
  function showStatus(m, c) {
    const s = document.getElementById('status');
    s.innerText = m; s.className = c; s.style.display = 'block';
  }
</script>
